version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orrica_edge_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: orrica_edge_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: orrica_edge_api
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/orrica_edge_db?schema=public'
      JWT_ACCESS_SECRET: 'orrica_edge_production_super_secret_jwt_2026'
      CORS_ORIGIN: 'http://localhost:3000,https://orricaedge.com'
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
